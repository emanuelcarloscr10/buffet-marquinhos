services:
  - type: web
    name: buffet-marquinhos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    disk:
      name: buffet-arquivos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: buffet-marquinhos-db
          property: connectionString
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: BUSINESS_TIMEZONE
        value: America/Sao_Paulo

databases:
  - name: buffet-marquinhos-db
    plan: basic-256mb
    databaseName: buffet_marquinhos
    user: buffet_marquinhos
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    ipAllowList: []
