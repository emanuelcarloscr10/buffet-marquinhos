{% extends "admin/base.html" %}
{% block title %}Entrar no painel{% endblock %}
{% block body %}
<main class="admin-login-shell">
  <section class="admin-login-card">
    <img src="{{ image_url(site.logo_storage, site.logo_filename) }}" alt="{{ site.brand_name }}">
    <div class="eyebrow">Área restrita</div>
    <h1>Painel administrativo</h1>
    <p>Entre com a senha para cuidar da agenda, textos, preços, cardápio e fotos.</p>
    {% include "admin/_flash.html" %}
    <form method="post" class="admin-form single">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Senha<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-gold" type="submit">Entrar</button>
    </form>
    <a class="admin-back" href="{{ url_for('inicio') }}">← Voltar ao site</a>
  </section>
</main>
{% endblock %}
